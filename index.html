<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANVIR HASAN</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/43490582?v=4">

  <meta name="description" content="Connecting to Tanvir's network hub. Auto-redirecting to tanvir.info">
  <meta name="author" content="Tanvir">

  <!-- Preconnect and load Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    /* ----------------------------------------------------
       DESIGN SYSTEM & THEME VARIABLES
       ---------------------------------------------------- */
    :root {
      --bg-primary: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --accent: #6366f1; /* Premium Indigo */
      --accent-bg: rgba(99, 102, 241, 0.08);
      --accent-glow: rgba(99, 102, 241, 0.2);
      --border: #e2e8f0;
      
      --card-bg: rgba(255, 255, 255, 0.45);
      --card-border: rgba(255, 255, 255, 0.6);

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-primary: #030712; /* Rich dark background */
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #475569;

      --accent: #818cf8; /* Bright Indigo */
      --accent-bg: rgba(129, 140, 248, 0.08);
      --accent-glow: rgba(129, 140, 248, 0.4);
      --border: #1f2937;
      
      --card-bg: rgba(17, 24, 39, 0.6);
      --card-border: rgba(255, 255, 255, 0.05);
    }

    /* ----------------------------------------------------
       BASE RESETS & CENTERING LAYOUT
       ---------------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 64px 20px 32px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Animated background blur blobs */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      animation: float 25s infinite ease-in-out;
    }

    [data-theme="light"] .blob {
      opacity: 0.08;
    }

    .blob-1 {
      width: 500px;
      height: 500px;
      background: var(--accent);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: #ec4899; /* Vibrant Pink */
      bottom: -10%;
      right: -10%;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: #06b6d4; /* Vibrant Cyan */
      top: 40%;
      left: 60%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(50px, 30px) scale(1.08);
      }
      66% {
        transform: translate(-30px, 50px) scale(0.95);
      }
    }

    .container {
      max-width: 450px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin: auto 0;
      z-index: 1;
    }



    /* ----------------------------------------------------
       TYPOGRAPHY
       ---------------------------------------------------- */
    .routing-header {
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text-primary);
    }

    .hero-title span {
      color: var(--accent);
      background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin-top: 8px;
    }

    .hero-desc:empty {
      display: none;
    }

    /* ----------------------------------------------------
       PREMIUM GLASS REDIRECT CARD
       ---------------------------------------------------- */
    .redirect-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    [data-theme="dark"] .redirect-card {
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* Countdown & Button cluster */
    .countdown-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }



    .countdown-svg {
      transform: rotate(-90deg);
      flex-shrink: 0;
    }

    .bg-circle {
      fill: none;
      stroke: var(--border);
      stroke-width: 4px;
    }

    .fg-circle {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-dasharray: 175.93;
      stroke-dashoffset: 175.93;
      transition: stroke-dashoffset 1s linear;
    }

    .countdown-text {
      transform: rotate(90deg);
      transform-origin: center;
      fill: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 20px;
      font-weight: 700;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
      background: #4f46e5;
    }

    [data-theme="dark"] .btn-primary:hover {
      background: #6366f1;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
      transform: translateY(-2px);
    }

    .btn-icon {
      width: 16px;
      height: 16px;
    }

    /* ----------------------------------------------------
       DEVELOPER CONSOLE/TERMINAL PANEL
       ---------------------------------------------------- */
    .terminal-panel {
      background: #090d16;
      border-radius: 10px;
      border: 1px solid #1e293b;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-align: left;
      color: #38bdf8;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
      width: 100%;
    }

    [data-theme="light"] .terminal-panel {
      background: #090d16;
      border-color: #334155;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 6px;
    }

    .terminal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-red { background: #ef4444; }
    .dot-yellow { background: #eab308; }
    .dot-green { background: #22c55e; }

    .terminal-title {
      color: #64748b;
      font-size: 0.7rem;
      margin-left: 4px;
    }

    .terminal-body {
      min-height: 80px;
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: #1e293b transparent;
    }

    .terminal-body::-webkit-scrollbar {
      width: 4px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background-color: #1e293b;
      border-radius: 2px;
    }

    .log-line {
      opacity: 0;
      transform: translateY(4px);
      animation: fadeInLog 0.3s forwards;
    }

    .log-line.info { color: #38bdf8; }
    .log-line.success { color: #4ade80; }
    .log-line.warn { color: #facc15; }

    @keyframes fadeInLog {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }



    /* ----------------------------------------------------
       SITE HEADER
       ---------------------------------------------------- */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    [data-theme="dark"] .site-header {
      background: rgba(3, 7, 18, 0.4);
    }

    .header-container {
      width: 100%;
      padding: 12px 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .header-logo {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-transform: uppercase;
      display: inline-block;
    }

    /* ----------------------------------------------------
       FOOTER & CLOCK
       ---------------------------------------------------- */
    .footer {
      width: 100%;
      max-width: 450px;
      padding-top: 24px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      z-index: 1;
    }


    /* ----------------------------------------------------
       RESPONSIVE DESIGN (MEDIA QUERIES)
       ---------------------------------------------------- */
    
    /* Tablets & Small Desktops (max-width: 768px) */
    @media (max-width: 768px) {
      body {
        padding: 64px 16px 24px;
      }

      .header-container {
        padding: 12px 16px;
      }

      .hero-title {
        font-size: 1.35rem;
      }

      .redirect-card {
        padding: 20px;
        gap: 16px;
        border-radius: 14px;
      }
    }

    /* Mobile Devices (max-width: 480px) */
    @media (max-width: 480px) {
      body {
        padding: 60px 12px 20px;
      }

      .header-container {
        padding: 12px 12px;
      }

      .hero-title {
        font-size: 1.2rem;
      }

      .hero-desc {
        font-size: 0.9rem;
      }

      .redirect-card {
        padding: 16px;
        gap: 12px;
        border-radius: 12px;
      }

      .countdown-section {
        flex-direction: row;
        text-align: left;
        gap: 12px;
      }

      .countdown-svg {
        width: 56px;
        height: 56px;
      }

      .btn {
        padding: 8px 12px;
        font-size: 0.8rem;
        border-radius: 8px;
      }

      .terminal-panel {
        padding: 10px;
        font-size: 0.72rem;
      }

      .terminal-body {
        min-height: 72px;
        max-height: 100px;
      }

      .footer {
        padding-top: 12px;
        margin-top: 16px;
      }
    }

    /* Ultra-small/Foldable Devices (max-width: 320px) */
    @media (max-width: 320px) {
      body {
        padding: 56px 8px 16px;
      }

      .hero-title {
        font-size: 1.1rem;
      }

      .redirect-card {
        padding: 12px;
        border-radius: 10px;
      }

      .countdown-svg {
        width: 48px;
        height: 48px;
      }

      .btn {
        padding: 6px 10px;
        font-size: 0.75rem;
      }
    }

    /* Landscape Mode for Mobile (max-height: 550px) */
    @media (max-height: 550px) and (orientation: landscape) {
      body {
        padding: 56px 20px 12px;
        justify-content: center;
      }

      .container {
        margin: auto;
        gap: 12px;
      }

      .routing-header {
        margin-bottom: 0;
      }

      .hero-title {
        font-size: 1.2rem;
      }

      .hero-desc {
        display: none; /* Hide description in landscape mobile to save vertical space */
      }

      .redirect-card {
        padding: 12px;
        gap: 12px;
        flex-direction: row;
        align-items: stretch;
        max-width: 520px;
      }

      .countdown-section {
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        width: auto;
        border-right: 1px solid var(--border);
        padding-right: 12px;
      }

      .countdown-svg {
        width: 52px;
        height: 52px;
      }

      .action-buttons {
        width: 110px;
        flex-grow: 0;
      }

      .btn {
        padding: 6px 10px;
        font-size: 0.75rem;
      }

      .terminal-panel {
        flex-grow: 1;
        margin-top: 0;
        padding: 8px;
      }

      .terminal-body {
        min-height: 50px;
        max-height: 80px;
      }

      .footer {
        padding-top: 4px;
        margin-top: 4px;
      }
    }
  </style>
</head>

<body>

  <!-- Always Visible Sticky Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="header-logo">TANVIR HASAN</div>
    </div>
  </header>

  <!-- Floating Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>



  <!-- Clean, Central Info Stack -->
  <main class="container">

    <div class="routing-header">
      <h1 class="hero-title">
        Connecting to <span>tanvir.info</span>
      </h1>
      <p class="hero-desc"></p>
    </div>

    <!-- Glassmorphic Redirection Control Panel -->
    <div class="redirect-card">
      <div class="countdown-section">
        <!-- Circular Progress Timer -->
        <svg class="countdown-svg" width="64" height="64" viewBox="0 0 64 64">
          <circle class="bg-circle" cx="32" cy="32" r="28" />
          <circle class="fg-circle" cx="32" cy="32" r="28" />
          <text class="countdown-text" x="32" y="32" dominant-baseline="central" text-anchor="middle">5</text>
        </svg>

        <!-- Redirection Options -->
        <div class="action-buttons">
          <button id="continueRedirect" class="btn btn-primary" aria-label="Continue auto-redirection" disabled>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Continue
          </button>
          <button id="pauseRedirect" class="btn btn-secondary" aria-label="Pause auto-redirection">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            Pause
          </button>
        </div>
      </div>

      <!-- Developer Command Console Output -->
      <div class="terminal-panel">
        <div class="terminal-header">
          <span class="terminal-dot dot-red"></span>
          <span class="terminal-dot dot-yellow"></span>
          <span class="terminal-dot dot-green"></span>
          <span class="terminal-title">bash - redirect.sh</span>
        </div>
        <div class="terminal-body" id="terminalLogs">
          <!-- Dynamically typed log entries go here -->
        </div>
      </div>
    </div>
  </main>

  <!-- Essential Footer -->
  <footer class="footer">
    <div>&copy; <span id="currentYear"></span> TANVIR HASAN</div>
  </footer>

  <!-- ----------------------------------------------------
       CORE APPLICATION CODE
       ---------------------------------------------------- -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // 1. REDIRECTION & ROUTING MANAGEMENT
      const destination = 'https://tanvir.info';

      // Check for redirection loops (if loaded directly on the target custom domain)
      const hostname = window.location.hostname.toLowerCase();
      const isLoop = (hostname === 'tanvir.info' || hostname === 'www.tanvir.info');

      // UI Elements
      const countdownText = document.querySelector('.countdown-text');
      const fgCircle = document.querySelector('.fg-circle');
      const terminalLogs = document.getElementById('terminalLogs');
      const heroTitle = document.querySelector('.hero-title');
      const heroDesc = document.querySelector('.hero-desc');
      const continueBtn = document.getElementById('continueRedirect');
      const pauseBtn = document.getElementById('pauseRedirect');

      let countdownValue = 5;
      let countdownInterval = null;
      let hasCancelled = false;

      // Circle stroke geometry for countdown
      const radius = 28;
      const circumference = 2 * Math.PI * radius; // ~175.93
      fgCircle.style.strokeDasharray = circumference;
      fgCircle.style.strokeDashoffset = circumference; // Start empty

      // Logger Helper
      function log(message, type = 'info') {
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        
        let prefix = '[info]';
        if (type === 'success') prefix = '[ok  ]';
        if (type === 'warn')    prefix = '[warn]';
        
        line.textContent = `${prefix} ${message}`;
        terminalLogs.appendChild(line);
        terminalLogs.scrollTop = terminalLogs.scrollHeight;
      }

      // Handle Loop Protection
      if (isLoop) {
        heroTitle.innerHTML = `Welcome to <span>tanvir.info</span>`;
        heroDesc.textContent = "You've landed on my home hub. Direct redirection has been paused to prevent a loop.";
        
        log(`Host verified: ${hostname}`, 'info');
        log('Redirection loop protection enabled.', 'warn');
        log('Auto-redirect bypassed. Static portal fully active.', 'success');
        
        fgCircle.style.strokeDashoffset = 0; // Show full circle
        countdownText.textContent = '🏠';
        continueBtn.style.display = 'none';
        pauseBtn.style.display = 'none';
      } else {
        // Start Redirection Flow
        log(`Initializing redirection sequences...`, 'info');
        
        // Sequenced Command Logs
        setTimeout(() => {
          if (hasCancelled) return;
          log(`Host resolved: ${destination}`, 'info');
        }, 800);

        setTimeout(() => {
          if (hasCancelled) return;
          log(`Handshake sent to gateway...`, 'info');
        }, 1800);

        setTimeout(() => {
          if (hasCancelled) return;
          log(`Verifying target headers...`, 'info');
        }, 2800);

        setTimeout(() => {
          if (hasCancelled) return;
          log(`Client payload ready. Transporting...`, 'success');
        }, 4000);

        // Run the countdown
        function startCountdown() {
          countdownInterval = setInterval(() => {
            countdownValue--;
            if (countdownValue < 0) countdownValue = 0;
            countdownText.textContent = countdownValue;

            // Fill the progress circle dynamically (drains as countdown counts down, or fills up)
            // Let's make it fill up (starts empty at offset=circumference, fills to 0 at value=0)
            const offset = circumference * (countdownValue / 5);
            fgCircle.style.strokeDashoffset = offset;

            if (countdownValue === 0) {
              clearInterval(countdownInterval);
              if (!hasCancelled) {
                window.location.href = destination;
              }
            }
          }, 1000);
        }

        // Initialize Countdown
        startCountdown();

        // Pause click handler
        pauseBtn.addEventListener('click', () => {
          hasCancelled = true;
          clearInterval(countdownInterval);
          
          log('Redirection paused by client request.', 'warn');
          
          pauseBtn.disabled = true;
          continueBtn.disabled = false;
        });

        // Continue click handler
        continueBtn.addEventListener('click', () => {
          if (hasCancelled) {
            hasCancelled = false;
            log('Redirection resumed.', 'info');
            
            pauseBtn.disabled = false;
            continueBtn.disabled = true;
            
            // Resume countdown
            countdownText.textContent = countdownValue;
            const offset = circumference * (countdownValue / 5);
            fgCircle.style.strokeDashoffset = offset;
            startCountdown();
          }
        });
      }



      // 3. COPYRIGHT YEAR
      const yearElement = document.getElementById('currentYear');
      if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
      }

    });
  </script>
</body>

</html>
